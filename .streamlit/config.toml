# CelLab GUI theme - "stained slide" direction (see docs/DESIGN.md, GUI section).
# Palette from histology stains: slide glass, hematoxylin, methylene blue. Fonts load from Google Fonts;
# without internet Streamlit falls back to the default sans-serif.

[theme]
base = "light"
# Methylene blue: the only accent (primary buttons, selected controls, focus). Not red, so a
# selection never looks like an error. White text on it has a contrast of about 6.5:1.
primaryColor = "#1F5FA6"
# Slide glass (page); fields, code blocks and the world stage are white, like cover slips.
backgroundColor = "#F3F5F8"
secondaryBackgroundColor = "#FFFFFF"
# Hematoxylin: all text.
textColor = "#2E2A5C"
linkColor = "#1F5FA6"
# Graticule grey: hairlines.
borderColor = "#D5DAE3"
showWidgetBorder = true
baseRadius = "small"
font = "Atkinson Hyperlegible Next:https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap, sans-serif"
codeFont = "Atkinson Hyperlegible Mono:https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&display=swap, monospace"
headingFontWeights = 700

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
